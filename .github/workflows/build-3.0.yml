name: Build Skyllia 3.x
on:
  push:
    branches:
      - ver/3.x

permissions: write-all

jobs:
  skyllia-dev:
    runs-on: ubuntu-22.04
    if: "!contains(github.event.commits[0].message, '[ci-skip]')"
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      - name: Configure Git User
        run: git config --global user.email "actions@github.com" && git config --global user.name "Github Actions"

      - name: Set version
        run: echo "BUILD_VERSION=3.0-${{ github.run_number }}" >> $GITHUB_ENV

      - name: Build Skyllia
        run: mvn -B clean package -Drevision=${{ env.BUILD_VERSION }}

      - name: Collect jars
        run: |
          mkdir -p release
          cp plugin/target/skyllia-plugin-*.jar release/Skyllia-${{ env.BUILD_VERSION }}.jar || true
          cp addons/*/target/*.jar release/ || true

      - name: Upload Snapshot jar
        uses: actions/upload-artifact@v4
        with:
          name: Skyllia-Build
          path: release/*.jar

      - name: Publish all modules to Nexus
        run: mvn -B deploy -Drevision=${{ env.BUILD_VERSION }} -DskipTests
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

      - name: Create Release
        if: github.event_name != 'pull_request' || (github.event.pull_request.number == 94 && github.event.pull_request.head.repo.full_name == github.repository)
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.tag }}
          name: ${{ env.project_id_b }} - ${{ github.run_number }}
          body: |
            This release is automatically compiled by GitHub Actions
            ### Commit Message
            ${{ env.commit_msg }}
          artifacts: release/*.jar
          generateReleaseNotes: true
          prerelease: ${{ env.pre }}
          makeLatest: ${{ env.make_latest }}
          token: ${{ secrets.GITHUB_TOKEN }}
          replacesArtifacts: false

env:
  tag: build-ver3.x-${{ github.run_number }}
  project_id_b: Skyllia
  commit_id: ${{ github.sha }}
  commit_msg: ${{ github.event.head_commit.message }}
  MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
  pre: false
  make_latest: true
  NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
  NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
